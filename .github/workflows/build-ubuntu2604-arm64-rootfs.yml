name: Build Ubuntu 26.04 amd64 RootFS (GNU coreutils locked)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Install debootstrap dependencies
        run: |
          sudo apt update
          sudo apt install -y debootstrap qemu-user-static binfmt-support xz-utils

      - name: Create rootfs workspace
        run: mkdir -p ./rootfs_out
        working-directory: ${{ github.workspace }}

      - name: Bootstrap Ubuntu 26.04 amd64 (Huawei mirror)
        run: |
          sudo debootstrap --arch=amd64 \
            --include=apt-transport-https,ca-certificates,openssh-server,locales,tzdata,sudo,iproute2,net-tools,vim,git,wget,curl \
            resolute ./rootfs_out https://mirrors.huaweicloud.com/ubuntu/
        working-directory: ${{ github.workspace }}

      - name: Configure Huawei APT source inside rootfs
        run: |
          sudo tee ./rootfs_out/etc/apt/sources.list <<'EOF'
          deb https://mirrors.huaweicloud.com/ubuntu/ resolute main restricted universe multiverse
          deb https://mirrors.huaweicloud.com/ubuntu/ resolute-security main restricted universe multiverse
          deb https://mirrors.huaweicloud.com/ubuntu/ resolute-updates main restricted universe multiverse
          EOF
        working-directory: ${{ github.workspace }}

      - name: Mount virtual fs for chroot
        run: |
          sudo mount --bind /dev ./rootfs_out/dev
          sudo mount --bind /dev/pts ./rootfs_out/dev/pts
          sudo mount -t proc none ./rootfs_out/proc
          sudo mount -t sysfs none ./rootfs_out/sys
        working-directory: ${{ github.workspace }}

      - name: Chroot configure coreutils lock & switch GNU coreutils
        run: |
          sudo chroot ./rootfs_out /bin/bash -c "
          set -e
          apt update
          # 1. 强制锁定 uutils-coreutils 相关包，禁止安装/升级
          cat > /etc/apt/preferences.d/block_uutils_coreutils <<APTPIN
          Package: uutils-coreutils rust-coreutils coreutils-from-uutils
          Pin: release a=*
          Pin-Priority: -10
          APTPIN

          # 标记这些包为禁止安装
          apt-mark hold uutils-coreutils rust-coreutils coreutils-from-uutils || true

          # 卸载已预装的uutils版本
          apt remove -y uutils-coreutils rust-coreutils coreutils-from-uutils --allow-remove-essential || true

          # 安装官方GNU coreutils
          apt install -y coreutils-from-gnu --allow-remove-essential

          # 设置系统默认使用GNU coreutils
          update-alternatives --set coreutils /usr/bin/coreutils.gnu
          # 固化软链接兜底
          ln -sf /usr/bin/coreutils.gnu /usr/bin/coreutils

          # 中文本地化配置
          locale-gen zh_CN.UTF-8
          echo 'LANG=zh_CN.UTF-8' > /etc/default/locale
          echo 'LC_ALL=zh_CN.UTF-8' >> /etc/default/locale

          # SSH基础配置
          sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          echo 'root:123456' | chpasswd

          # 清理缓存减小体积
          apt autoremove -y
          apt clean
          rm -rf /var/lib/apt/lists/*
          "
        working-directory: ${{ github.workspace }}

      - name: Unmount virtual filesystems safely
        run: |
          sudo umount ./rootfs_out/sys
          sudo umount ./rootfs_out/proc
          sudo umount ./rootfs_out/dev/pts
          sudo umount ./rootfs_out/dev
        working-directory: ${{ github.workspace }}

      - name: Pack rootfs to tar.xz
        run: |
          sudo tar -cJf ubuntu2604-amd64-gnu-coreutils.tar.xz -C ./rootfs_out .
        working-directory: ${{ github.workspace }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu2604-amd64-rootfs
          path: ubuntu2604-amd64-gnu-coreutils.tar.xz
          retention-days: 30








