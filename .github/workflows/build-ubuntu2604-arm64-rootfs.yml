name: Build Ubuntu 26.04 Resolute arm64 RootFS (Base Tools + Docker)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动点按钮触发构建

jobs:
  build_rootfs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y debootstrap qemu-user-static binfmt-support tar gzip xz-utils rsync coreutils

      - name: Enable binfmt_misc for ARM64 emulation
        run: |
          sudo update-binfmts --enable qemu-aarch64
          qemu-aarch64-static --version

      - name: Build Ubuntu 26.04 Resolute arm64 minimal rootfs
        env:
          CODENAME: resolute
          ARCH: arm64
          ROOTFS_DIR: ./ubuntu2604-resolute-arm64-rootfs
          MIRROR: https://mirrors.aliyun.com/ubuntu-ports
        run: |
          set -e
          rm -rf ${ROOTFS_DIR}
          mkdir -p ${ROOTFS_DIR}

          # Bootstrap 最小化minbase系统
          sudo debootstrap \
            --variant=minbase \
            --arch=${ARCH} \
            ${CODENAME} \
            ${ROOTFS_DIR} \
            ${MIRROR}

          # 注入qemu静态二进制用于chroot内arm64执行
          sudo cp $(which qemu-aarch64-static) ${ROOTFS_DIR}/usr/bin/

          # 替换ARM架构APT源
          sudo tee ${ROOTFS_DIR}/etc/apt/sources.list <<EOF
          deb ${MIRROR} ${CODENAME} main restricted universe multiverse
          deb ${MIRROR} ${CODENAME}-updates main restricted universe multiverse
          deb ${MIRROR} ${CODENAME}-backports main restricted universe multiverse
          deb http://ports.ubuntu.com/ ${CODENAME}-security main restricted universe multiverse
          EOF

          # 主机名、hosts、DNS配置
          echo "ubuntu2604-resolute-arm64" | sudo tee ${ROOTFS_DIR}/etc/hostname
          sudo tee ${ROOTFS_DIR}/etc/hosts <<EOF
          127.0.0.1   localhost ubuntu2604-resolute-arm64::1         ip6-localhost ip6-loopback
          EOF
          echo "nameserver 223.5.5.5" | sudo tee ${ROOTFS_DIR}/etc/resolv.conf
          echo "nameserver 114.114.114.114" | sudo tee -a ${ROOTFS_DIR}/etc/resolv.conf

          # Chroot内部安装基础工具 + Docker CE
          sudo chroot ${ROOTFS_DIR} /usr/bin/qemu-aarch64-static /bin/bash <<INNER
          set -e
          apt update

          # 预装基础常用软件包
          apt install -y --no-install-recommends \
            apt-transport-https ca-certificates gnupg2 openssl sudo \
            curl wget git vim-tiny nano tree htop ncdu \
            iproute2 net-tools iputils-ping dnsutils traceroute \
            zip unzip tar xz-utils bzip2 build-essential make gcc g++ cmake tzdata locales

          # 时区上海 + 中文UTF-8
          ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo "Asia/Shanghai" > /etc/timezone
          locale-gen zh_CN.UTF-8
          update-locale LANG=zh_CN.UTF-8

          # 官方Docker CE 安装（resolute版本）
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
          echo "deb [arch=arm64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu resolute stable" | tee /etc/apt/sources.list.d/docker.list

          apt update
          apt install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin

          # root加入docker免sudo组
          usermod -aG docker root

          # 深度清理，减小rootfs体积
          apt autoremove -y
          apt autoclean
          apt clean
          rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
          INNER

          # 删除qemu-static，成品rootfs不需要
          sudo rm -f ${ROOTFS_DIR}/usr/bin/qemu-aarch64-static

          # 打包最终压缩包
          sudo tar -zcpf ubuntu2604-resolute-arm64-docker-rootfs.tar.gz -C ${ROOTFS_DIR} .

      - name: Upload build artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu2604-resolute-arm64-rootfs-with-docker
          path: ubuntu2604-resolute-arm64-docker-rootfs.tar.gz
          retention-days: 90
