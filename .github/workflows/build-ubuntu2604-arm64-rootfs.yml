name: Build Ubuntu 26.04 Resolute ARM64 RootFS via LXC
run-name: LXC Build Ubuntu 26.04 resolute arm64 Full Localized RootFS + OpenClaw + SSH

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 手动触发

env:
  CODENAME: resolute
  ARCH: arm64
  LXC_CONTAINER_NAME: u2604-arm64-build
  OUTPUT_TAR: ubuntu-26.04-resolute-arm64-lxc-rootfs.tar.xz
  TIMEZONE: Asia/Shanghai

jobs:
  build_with_lxc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Install LXC + QEMU arm64 cross build dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y -qq lxc lxc-templates qemu-user-static binfmt-support xz-utils util-linux curl wget ca-certificates
          # 注册arm64二进制模拟，LXC可直接跑aarch64容器
          sudo update-binfmts --enable qemu-aarch64
          # 初始化LXC
          sudo lxd init --auto || true

      - name: Configure LXC remote & Ubuntu official image source
        run: |
          # 添加Ubuntu官方镜像源
          sudo lxc remote add ubuntu-images https://images.lxd.canonical.com --protocol=lxd || true
          sudo lxc remote list

      - name: Create & Start Ubuntu 26.04 arm64 LXC Container
        run: |
          # 从Ubuntu官方镜像拉取 resolute arm64
          sudo lxc launch ubuntu-images:${{ env.CODENAME }}/${{ env.ARCH }} ${{ env.LXC_CONTAINER_NAME }}
          # 等待容器网络与系统完全就绪
          sleep 45
          sudo lxc info ${{ env.LXC_CONTAINER_NAME }}

      - name: Inside LXC container bulk configuration
        run: |
          sudo lxc exec ${{ env.LXC_CONTAINER_NAME }} -- bash <<'EOF'
          set -euo pipefail
          CODENAME=resolute

          # ========== 1. 替换APT源为华为云Ubuntu镜像源 ==========
          cat > /etc/apt/sources.list <<LIST
          deb https://mirrors.huaweicloud.com/ubuntu/ ${CODENAME} main restricted universe multiverse
          deb https://mirrors.huaweicloud.com/ubuntu/ ${CODENAME}-security main restricted universe multiverse
          deb https://mirrors.huaweicloud.com/ubuntu/ ${CODENAME}-updates main restricted universe multiverse
          deb https://mirrors.huaweicloud.com/ubuntu/ ${CODENAME}-backports main restricted universe multiverse
          LIST

          apt update -qq
          apt full-upgrade -y -qq

          # ========== 2. 完整中文本地化 + 时区 ==========
          locale-gen zh_CN.UTF-8
          update-locale LANG=zh_CN.UTF-8 LC_ALL=zh_CN.UTF-8 LC_MESSAGES=zh_CN.UTF-8
          echo 'LANG=zh_CN.UTF-8' > /etc/default/locale
          echo 'LC_ALL=zh_CN.UTF-8' >> /etc/default/locale

          timedatectl set-timezone Asia/Shanghai

          # 中文语言包、中文字体、中文man手册
          apt install -y -qq \
            language-pack-zh-hans language-pack-zh-hans-base \
            fonts-wqy-zenhei fonts-noto-cjk fonts-noto-cjk-extra \
            manpages-zh ttf-mscorefonts-installer

          # ========== 3. 最全常用工具大包（编译/网络/运维/磁盘/监控） ==========
          apt install -y -qq \
            build-essential gcc g++ make cmake pkg-config libssl-dev libc6-dev git git-lfs \
            openssh-server net-tools iproute2 iputils-ping dnsutils traceroute mtr iftop nload \
            tcpdump socat ncftp rsync wget curl axel aria2 nmap ipset iptables wireguard-tools \
            fdisk parted lsblk blkid e2fsprogs dosfstools ntfs-3g squashfs-tools \
            htop atop iotop bmon tree vim nano less cron logrotate lsof psmisc screen tmux \
            zip unzip rar unrar p7zip-full gzip bzip2 xz-utils zstd pigz \
            sudo ca-certificates software-properties-common apt-transport-https gnupg2 \
            jq yq bc dos2unix uuid-runtime sysstat dmidecode hdparm util-linux

          # ========== 4. OpenSSH systemd配置、开机自启、Root可登录 ==========
          systemctl enable --now ssh
          sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sed -i 's/#PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          systemctl reload sshd

          # 设置root默认密码 root（生产务必修改/禁用密码登录）
          echo "root:root" | chpasswd

          # ========== 5. 官方脚本安装 OpenClaw ==========
          curl -fsSL https://openclaw.ai/install.sh | bash

          # ========== 6. 清理缓存减小镜像体积 ==========
          apt autoremove -y -qq
          apt autoclean
          apt clean
          rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* /root/.cache/*

          # 屏蔽apt不稳定CLI警告
          echo 'APT::Get::Quiet::Warning "false";' > /etc/apt/apt.conf.d/99quiet
          EOF

      - name: Stop LXC container before export
        run: |
          sudo lxc stop ${{ env.LXC_CONTAINER_NAME }}
          sleep 10

      - name: Export LXC container rootfs to tar.xz
        run: |
          # LXC导出容器文件系统
          sudo lxc export ${{ env.LXC_CONTAINER_NAME }} ./${{ env.OUTPUT_TAR}} --rootfs-only
          ls -lh ./${{ env.OUTPUT_TAR}}

      - name: Cleanup destroy LXC container
        if: always()
        run: |
          sudo lxc delete -f ${{ env.LXC_CONTAINER_NAME }} || true

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu26.04-resolute-arm64-LXC-rootfs
          path: ${{ env.OUTPUT_TAR }}
          retention-days: 90








