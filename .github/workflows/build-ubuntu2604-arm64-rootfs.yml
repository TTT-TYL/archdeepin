
name: Build Ubuntu 26.04 Resolute ARM64 RootFS via LXD
run-name: LXD Build Ubuntu 26.04 resolute arm64 Full Chinese + OpenClaw + SSH

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  CODENAME: resolute
  TARGET_ARCH: arm64
  LXD_CT_NAME: u2604-arm64-builder
  OUTPUT_ARCHIVE: ubuntu-26.04-resolute-arm64-lxd-rootfs.tar.xz

jobs:
  build_rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install LXD + QEMU cross compile dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y -qq lxd qemu-user-static binfmt-support xz-utils util-linux curl wget ca-certificates
          # 开启arm64二进制模拟
          sudo update-binfmts --enable qemu-aarch64
          # 将当前用户加入lxd组，避免sudo频繁授权
          sudo usermod -aG lxd $USER
          newgrp lxd <<EOF
            lxd init --auto
          EOF

      - name: Configure official Ubuntu LXD remote (correct remote name)
        run: |
          # 官方正确远程名称：ubuntu，不是ubuntu-images
          lxc remote remove ubuntu || true
          lxc remote add ubuntu https://cloud-images.ubuntu.com/releases/ --protocol=lxd
          lxc remote list
          lxc image list ubuntu: | grep ${{ env.CODENAME }}

      - name: Launch Ubuntu 26.04 arm64 container
        run: |
          # 标准镜像格式 ubuntu:resolute/arm64
          lxc launch ubuntu:${{ env.CODENAME }}/${{ env.TARGET_ARCH }} ${{ env.LXD_CT_NAME }}
          # 长时间等待systemd、网络、apt就绪，arm64模拟启动较慢
          sleep 90
          lxc info ${{ env.LXD_CT_NAME }}

      - name: Execute bulk configuration inside LXD container
        run: |
          lxc exec ${{ env.LXD_CT_NAME }} -- bash <<'CHROOT_EOF'
          set -euo pipefail
          CODENAME=resolute

          # 1. Replace apt source to Huawei Cloud mirror
          cat > /etc/apt/sources.list <<LIST
          deb https://mirrors.huaweicloud.com/ubuntu/ ${CODENAME} main restricted universe multiverse
          deb https://mirrors.huaweicloud.com/ubuntu/ ${CODENAME}-security main restricted universe multiverse
          deb https://mirrors.huaweicloud.com/ubuntu/ ${CODENAME}-updates main restricted universe multiverse
          deb https://mirrors.huaweicloud.com/ubuntu/ ${CODENAME}-backports main restricted universe multiverse
          LIST

          apt update -qq
          apt full-upgrade -y -qq

          # 2. Full Chinese localization & Shanghai timezone
          locale-gen zh_CN.UTF-8
          update-locale LANG=zh_CN.UTF-8 LC_ALL=zh_CN.UTF-8 LC_MESSAGES=zh_CN.UTF-8
          echo 'LANG=zh_CN.UTF-8' > /etc/default/locale
          echo 'LC_ALL=zh_CN.UTF-8' >> /etc/default/locale
          timedatectl set-timezone Asia/Shanghai

          apt install -y -qq \
            language-pack-zh-hans language-pack-zh-hans-base \
            fonts-wqy-zenhei fonts-noto-cjk fonts-noto-cjk-extra \
            manpages-zh ttf-mscorefonts-installer

          # 3. Full common dev & ops toolchain
          apt install -y -qq \
            build-essential gcc g++ make cmake pkg-config libssl-dev libc6-dev git git-lfs \
            openssh-server net-tools iproute2 iputils-ping dnsutils traceroute mtr iftop nload \
            tcpdump socat ncftp rsync wget curl axel aria2 nmap ipset iptables wireguard-tools \
            fdisk parted lsblk blkid e2fsprogs dosfstools ntfs-3g squashfs-tools \
            htop atop iotop bmon tree vim nano less cron logrotate lsof psmisc screen tmux \
            zip unzip rar unrar p7zip-full gzip bzip2 xz-utils zstd pigz \
            sudo ca-certificates software-properties-common apt-transport-https gnupg2 \
            jq yq bc dos2unix uuid-runtime sysstat dmidecode hdparm util-linux

          # 4. OpenSSH systemd config & auto start
          systemctl enable --now ssh
          sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sed -i 's/#PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          systemctl reload sshd
          echo "root:root" | chpasswd

          # 5. Install OpenClaw via official script
          curl -fsSL https://openclaw.ai/install.sh | bash

          # 6. Clean cache to shrink rootfs size
          apt autoremove -y -qq
          apt autoclean
          apt clean
          rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* /root/.cache/*

          # Hide apt unstable CLI warning
          echo 'APT::Get::Quiet::Warning "false";' > /etc/apt/apt.conf.d/99quiet
          CHROOT_EOF

      - name: Stop container before export
        run: |
          lxc stop ${{ env.LXD_CT_NAME }}
          sleep 15

      - name: Export pure rootfs tar.xz (only filesystem, no LXD metadata)
        run: |
          lxc export ${{ env.LXD_CT_NAME }} ./${{ env.OUTPUT_ARCHIVE }} --rootfs-only
          ls -lh ./${{ env.OUTPUT_ARCHIVE }}

      - name: Cleanup container always
        if: always()
        run: |
          lxc delete -f ${{ env.LXD_CT_NAME }} || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu26.04-resolute-arm64-LXD-rootfs
          path: ${{ env.OUTPUT_ARCHIVE }}
          retention-days: 90








