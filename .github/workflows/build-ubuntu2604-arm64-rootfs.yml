name: Build Ubuntu 26.04 Resolute ARM64 Localized RootFS
run-name: Build Ubuntu 26.04 resolute arm64 rootfs @ ${{ github.sha }}

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 允许页面手动触发构建

jobs:
  build_rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout empty workspace
        uses: actions/checkout@v4

      - name: Install cross-build & qemu emulation dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            debootstrap qemu-user-static binfmt-support \
            dpkg-cross tar xz-utils rsync coreutils  \
            ca-certificates gnupg2

          # 注册aarch64 binfmt，使chroot可执行ARM64二进制
          sudo update-binfmts --enable qemu-aarch64
          sudo systemctl restart binfmt-support

      - name: Set global environment variables
        id: env_vars
        run: |
          echo "DIST_CODENAME=resolute" >> $GITHUB_ENV
          echo "TARGET_ARCH=arm64" >> $GITHUB_ENV
          echo "ROOTFS_PATH=./ubuntu2604-resolute-arm64-rootfs" >> $GITHUB_ENV
          echo "TIMEZONE=Asia/Shanghai" >> $GITHUB_ENV
          echo "ROOT_PASSWORD=Root@123456" >> $GITHUB_ENV

      - name: Bootstrap base Ubuntu 26.04 arm64 rootfs (Huawei Cloud source)
        run: |
          sudo rm -rf ${{ env.ROOTFS_PATH }}
          sudo mkdir -p ${{ env.ROOTFS_PATH }}

          sudo debootstrap \
            --arch=${{ env.TARGET_ARCH }} \
            --include=locales,apt-transport-https,ca-certificates,gnupg,systemd,sudo \
            ${{ env.DIST_CODENAME }} \
            ${{ env.ROOTFS_PATH }} \
            https://mirrors.huaweicloud.com/ubuntu-ports/

      - name: Mount virtual fs & inject qemu-aarch64-static
        run: |
          # 绑定挂载必要文件系统供chroot使用
          sudo mount --bind /dev     ${{ env.ROOTFS_PATH }}/dev
          sudo mount --bind /dev/pts ${{ env.ROOTFS_PATH }}/dev/pts
          sudo mount --bind /proc    ${{ env.ROOTFS_PATH }}/proc
          sudo mount --bind /sys     ${{ env.ROOTFS_PATH }}/sys

          # 拷贝静态qemu解释器到rootfs内，ARM64程序才能运行
          sudo cp /usr/bin/qemu-aarch64-static ${{ env.ROOTFS_PATH }}/usr/bin/

      - name: Chroot internal full system configuration
        run: |
          sudo chroot ${{ env.ROOTFS_PATH }} /bin/bash <<'INNER_EOF'
          set -euo pipefail
          export CODENAME=resolute
          export TZ=Asia/Shanghai

          ###########################################################################
          # 1. 替换华为云ARM64 Ubuntu软件源 sources.list
          ###########################################################################
          cat > /etc/apt/sources.list <<SOURCES
          deb https://mirrors.huaweicloud.com/ubuntu-ports/ ${CODENAME} main restricted universe multiverse
          deb https://mirrors.huaweicloud.com/ubuntu-ports/ ${CODENAME}-security main restricted universe multiverse
          deb https://mirrors.huaweicloud.com/ubuntu-ports/ ${CODENAME}-updates main restricted universe multiverse
          deb https://mirrors.huaweicloud.com/ubuntu-ports/ ${CODENAME}-backports main restricted universe multiverse
          SOURCES

          apt clean
          apt update
          apt full-upgrade -y

          ###########################################################################
          # 2. 完整中文本地化环境
          ###########################################################################
          # 生成中文UTF-8 locale
          locale-gen zh_CN.UTF-8
          update-locale LANG=zh_CN.UTF-8 LC_ALL=zh_CN.UTF-8 LANGUAGE=zh_CN:zh

          # 写入默认locale配置
          echo 'LANG=zh_CN.UTF-8' > /etc/default/locale

          # 设置上海时区
          ln -sf /usr/share/zoneinfo/${TZ} /etc/localtime
          echo "${TZ}" > /etc/timezone
          dpkg-reconfigure -f noninteractive tzdata

          # 安装全套中文语言包+中文字体
          apt install -y \
            language-pack-zh-hans language-pack-zh-hans-base \
            fonts-wqy-zenhei fonts-wqy-microhei fonts-noto-cjk fonts-noto-sans-cjk

          ###########################################################################
          # 3. 批量安装最全常用工具包（运维、网络、编译、调试、存储、性能）
          ###########################################################################
          apt install -y \
            # 基础命令行编辑器
            vim nano neovim tmux screen less more tree bat fd-find fzf \
            # 网络工具全家桶
            openssh-server curl wget git iproute2 net-tools ifupdown dnsutils \
            traceroute mtr tcpdump nmap socat ipset iptables arpwatch whois dig \
            rsync openssl libssl-dev openssl-dev \
            # 压缩解压
            zip unzip bzip2 gzip xz-utils p7zip-full tar pigz \
            # 系统监控性能工具
            htop iotop iftop atop sysstat lsof strace ltrace procps psmisc \
            # 磁盘文件系统工具
            parted fdisk lsblk blkid e2fsprogs dosfstools ntfs-3g \
            # 编译开发基础套件
            build-essential gcc g++ make cmake pkg-config git-core libtool autoconf automake \
            libopencl-dev clinfo ocl-icd-opencl-dev \
            # 其他实用工具
            jq bc calculator cron logrotate man-db sudo passwd adduser dbus

          ###########################################################################
          # 4. OpenSSH Server 安全配置与开机自启
          ###########################################################################
          # 允许root登录 + 密码登录（生产环境可改为PasswordAuthentication no）
          sed -i 's/^#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sed -i 's/^#PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config

          # 允许密码过期可登录、启用端口22
          sed -i 's/^#PermitEmptyPasswords no/PermitEmptyPasswords no/' /etc/ssh/sshd_config

          # 设置root密码
          echo "root:Root@123456" | chpasswd

          # systemd 开机自启ssh服务
          systemctl enable ssh.service
          systemctl daemon-reload

          ###########################################################################
          # 5. 官方脚本安装 OpenClaw
          ###########################################################################
          curl -fsSL https://openclaw.ai/install.sh | bash

          ###########################################################################
          # 6. 镜像瘦身清理，减小体积
          ###########################################################################
          apt autoremove -y
          apt autoclean
          apt clean
          rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* /root/.bash_history
          rm -rf /var/log/* /var/cache/*
          history -c
          INNER_EOF

      - name: Safely unmount chroot bind mounts（必须always执行防止挂载残留）
        if: always()
        run: |
          set +e
          sudo umount --lazy ${{ env.ROOTFS_PATH }}/sys
          sudo umount --lazy ${{ env.ROOTFS_PATH }}/proc
          sudo umount --lazy ${{ env.ROOTFS_PATH }}/dev/pts
          sudo umount --lazy ${{ env.ROOTFS_PATH }}/dev
          echo "All virtual filesystems unmounted successfully"

      - name: Compress rootfs to tar.xz high compression
        run: |
          OUTPUT_NAME="ubuntu26.04-resolute-arm64-full-localized-rootfs.tar.xz"
          tar -cJvf ${OUTPUT_NAME} -C ${{ env.ROOTFS_PATH }} .
          ls -lh ${OUTPUT_NAME}

      - name: Upload build artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu2604-resolute-arm64-rootfs-package
          path: ubuntu26.04-resolute-arm64-full-localized-rootfs.tar.xz
          retention-days: 90




