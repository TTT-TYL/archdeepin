name: Build Ubuntu 26.04 ARM64 LXC RootFS | ZH + OpenClaw + SSH
run-name: LXC Special Ubuntu 26.04 arm64 rootfs Full Chinese OpenClaw

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_lxc_rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: 安装宿主机构建依赖（QEMU跨架构+debootstrap）
        run: |
          sudo apt update
          sudo apt install -y debootstrap qemu-user-static binfmt-support \
            coreutils rsync tar gzip locales wget curl git unzip
          sudo update-binfmts --enable qemu-aarch64

      - name: 定义全局环境变量
        id: set_vars
        run: |
          echo "ROOTFS_BASE=$HOME/lxc-ubuntu2604-arm64" >> $GITHUB_ENV
          echo "CODENAME=plucky" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "OUTPUT_TAR=lxc-ubuntu2604-plucky-arm64-zh-openclaw.tar.gz" >> $GITHUB_ENV

      - name: debootstrap 最小化拉取ARM64 Ubuntu26.04基础系统
        run: |
          sudo rm -rf ${{ env.ROOTFS_BASE }}
          sudo mkdir -p ${{ env.ROOTFS_BASE }}
          sudo debootstrap \
            --arch=${{ env.ARCH }} \
            --variant=minbase \
            --components=main,universe,restricted \
            ${{ env.CODENAME }} \
            ${{ env.ROOTFS_BASE }} \
            http://ports.ubuntu.com/ubuntu-ports/

          sudo cp /usr/bin/qemu-aarch64-static ${{ env.ROOTFS_BASE }}/usr/bin/

      - name: Chroot 深度定制 LXC 专用系统
        run: |
          sudo mount --bind /dev ${{ env.ROOTFS_BASE }}/dev
          sudo mount --bind /proc ${{ env.ROOTFS_BASE }}/proc
          sudo mount --bind /sys ${{ env.ROOTFS_BASE }}/sys

          sudo chroot ${{ env.ROOTFS_BASE }} /bin/bash <<'INNER_SCRIPT'
          set -e

          # 华为云arm64源
          cat > /etc/apt/sources.list <<EOF
          deb https://mirrors.huaweicloud.com/ubuntu-ports/ plucky main restricted universe multiverse
          deb https://mirrors.huaweicloud.com/ubuntu-ports/ plucky-updates main restricted universe multiverse
          deb https://mirrors.huaweicloud.com/ubuntu-ports/ plucky-backports main restricted universe multiverse
          deb https://mirrors.huaweicloud.com/ubuntu-ports/ plucky-security main restricted universe multiverse
          EOF
          apt update

          # 完整中文本地化
          apt install -y language-pack-zh-hans language-pack-zh-hans-base \
            fonts-noto-cjk fonts-wqy-microhei locales
          locale-gen zh_CN.UTF-8

          cat > /etc/default/locale <<LOCALE_CFG
          LANG="zh_CN.UTF-8"
          LANGUAGE="zh_CN:zh"
          LC_ALL="zh_CN.UTF-8"
          LOCALE_CFG

          echo 'export LANG=zh_CN.UTF-8' >> /etc/profile
          echo 'export LC_ALL=zh_CN.UTF-8' >> /etc/profile

          # ===================== 修复后的安装包列表（重点修改）=====================
          apt install -y --no-install-recommends \
            openssh-server openssh-client sudo vim nano tmux htop iotop iftop \
            net-tools iproute2 dnsutils traceroute curl wget git make cmake gcc g++ \
            build-essential zip unzip tar gzip bzip2 lz4 rsync tree ncdu util-linux \
            ca-certificates tzdata systemd cron logrotate man-db dbus \
            libpam-modules libpam-runtime passwd

          # 时区
          ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo "Asia/Shanghai" > /etc/timezone

          # SSH允许root密码登录
          sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sed -i 's/#PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          systemctl enable ssh

          # root密码123456
          echo 'root:123456' | chpasswd

          # LXC适配优化
          systemctl mask dev-mqueue.mount dev-hugepages.mount sys-fs-fuse-connections.mount
          rm -f /etc/machine-id
          touch /etc/machine-id
          echo "" > /etc/hostname
          echo "nameserver 114.114.114.114" > /etc/resolv.conf
          sed -i 's/#DefaultTimeoutStartSec=90s/DefaultTimeoutStartSec=30s/' /etc/systemd/system.conf

          # 安装Node.js + pnpm + OpenClaw
          curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
          apt install -y nodejs npm
          npm install -g pnpm

          curl -fsSL https://openclaw.ai/install.sh | bash -s -- --no-onboard
          openclaw --version || true

          # 清理
          apt autoremove -y
          apt autoclean
          apt clean
          rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
          rm -rf /var/cache/apt/* /root/.bash_history
          INNER_SCRIPT

          sudo umount ${{ env.ROOTFS_BASE }}/sys
          sudo umount ${{ env.ROOTFS_BASE }}/proc
          sudo umount ${{ env.ROOTFS_BASE }}/dev

      - name: 打包LXC标准压缩包
        run: |
          cd ${{ env.ROOTFS_BASE }}
          sudo tar -zcpf $GITHUB_WORKSPACE/${{ env.OUTPUT_TAR }} .
          ls -lh $GITHUB_WORKSPACE/${{ env.OUTPUT_TAR }}

      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: lxc-ubuntu2604-arm64-zh-openclaw-rootfs
          path: ${{ env.OUTPUT_TAR }}
          retention-days: 90




