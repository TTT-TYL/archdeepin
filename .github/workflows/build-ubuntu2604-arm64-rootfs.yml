name: Build Ubuntu26.04 amd64 RootFS Native Coreutils su nopasswd
run-name: Ubuntu26.04 amd64 原生coreutils su免密 修复账号锁定

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: 安装宿主机构建依赖
        run: |
          sudo apt update -y
          sudo apt install -y debootstrap qemu-user-static binfmt-support xz-utils

      - name: 初始化工作目录
        run: mkdir -p ./rootfs
        working-directory: ${{ github.workspace }}

      - name: debootstrap 初始化基础系统
        run: |
          sudo debootstrap --arch=amd64 --include=ca-certificates,openssh-server,locales,tzdata,sudo,vim,curl,wget,git,iproute2,net-tools,passwd,libpam-modules,libpam-runtime,login resolute ./rootfs http://azure.archive.ubuntu.com/ubuntu
        working-directory: ${{ github.workspace }}

      - name: 替换全局APT华为云源
        run: |
          sudo tee ./rootfs/etc/apt/sources.list <<'EOF'
          deb http://azure.archive.ubuntu.com/ubuntu/ resolute main restricted universe multiverse
          deb http://azure.archive.ubuntu.com/ubuntu/ resolute-security main restricted universe multiverse
          deb http://azure.archive.ubuntu.com/ubuntu/ resolute-updates main restricted universe multiverse
          deb http://azure.archive.ubuntu.com/ubuntu/ resolute-backports main restricted universe multiverse
          EOF
        working-directory: ${{ github.workspace }}

      - name: 挂载chroot虚拟文件系统
        run: |
          sudo mount --bind /dev ./rootfs/dev
          sudo mount --bind /dev/pts ./rootfs/dev/pts
          sudo mount -t proc none ./rootfs/proc
          sudo mount -t sysfs none ./rootfs/sys
        working-directory: ${{ github.workspace }}

      - name: Chroot内部配置、修复账号异常、开启su免密
        run: |
          sudo chroot ./rootfs /bin/bash -e <<'INNER_SCRIPT'
          apt update -y

          echo 'APT::Install-Recommends "false";' > /etc/apt/apt.conf.d/99-no-recommends
          echo 'APT::AutoRemove::Recommends "false";' >> /etc/apt/apt.conf.d/99-no-recommends

          # 移除shadow-utils，该包在resolute不存在，跳过安装
          apt install --reinstall -y sudo passwd libpam-modules libpam-runtime login --allow-remove-essential

          # 重置root密码123456
          echo "root:123456" | chpasswd
          passwd -u root
          faillock --reset --user root || true
          pam-auth-update --force

          # 修复SUID与关键文件权限
          chmod 4755 /usr/bin/sudo
          chmod 4755 /bin/su
          chmod 600 /etc/shadow
          chmod 644 /etc/passwd
          chmod 640 /etc/group
          chown root:root /etc/shadow /etc/passwd /etc/group

          # ========== su 切换root免密码（适配新版Ubuntu，抛弃wheel组） ==========
          # 注释掉su的密码验证模块
          sed -i 's/^auth\s*required\s*pam_unix.so/#auth    required pam_unix.so/' /etc/pam.d/su

          # root执行sudo全部免密
          echo "root ALL=(ALL:ALL) NOPASSWD: ALL" >> /etc/sudoers
          visudo -c || true

          # 中文本地化
          locale-gen zh_CN.UTF-8
          echo "LANG=zh_CN.UTF-8" > /etc/default/locale
          echo "LC_ALL=zh_CN.UTF-8" >> /etc/default/locale
          update-locale LANG=zh_CN.UTF-8 LC_ALL=zh_CN.UTF-8

          # SSH允许root密码登录并开机自启
          sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          systemctl enable ssh

          apt clean
          rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
          INNER_SCRIPT
        working-directory: ${{ github.workspace }}

      - name: 安全卸载挂载目录
        run: |
          sudo umount -l ./rootfs/sys
          sudo umount -l ./rootfs/proc
          sudo umount -l ./rootfs/dev/pts
          sudo umount -l ./rootfs/dev
        working-directory: ${{ github.workspace }}

      - name: 打包rootfs压缩包
        run: |
          sudo tar -cJf ubuntu2604-resolute-amd64-native-rootfs.tar.xz -C ./rootfs .
        working-directory: ${{ github.workspace }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu2604-amd64-native-rootfs
          path: ubuntu2604-resolute-amd64-native-rootfs.tar.xz
          retention-days: 30

