name: Debootstrap + LXD Configure Ubuntu26.04 Resolute ARM64 RootFS
run-name: debootstrap base -> LXD config full rootfs with OpenClaw & Chinese

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  CODENAME: resolute
  ARCH: arm64
  DEBOOTSTRAP_ROOTFS: ./tmp-rootfs
  LXD_ALIAS: u2604-custom-arm64
  LXD_CT_NAME: u2604-config-ct
  FINAL_TARBALL: ubuntu-26.04-resolute-arm64-debootstrap-lxd-rootfs.tar.xz

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout empty workspace
        uses: actions/checkout@v4

      - name: Install all dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y -qq \
            debootstrap qemu-user-static binfmt-support lxd xz-utils util-linux \
            curl wget ca-certificates tar coreutils
          # 启用arm64二进制跨架构模拟
          sudo update-binfmts --enable qemu-aarch64
          # 初始化LXD
          sudo usermod -aG lxd $USER
          newgrp lxd <<EOF
            lxd init --auto
          EOF
          # 清理默认ubuntu远程避免冲突
          lxc remote remove ubuntu || true
          lxc remote add ubuntu https://cloud-images.ubuntu.com/releases/ --protocol=lxd

      ###########################################################################
      # Step1: debootstrap 官方源构建纯arm64 rootfs（要求：构建源为官方）
      ###########################################################################
      - name: Stage1 Debootstrap official source arm64 rootfs
        run: |
          sudo rm -rf ${{ env.DEBOOTSTRAP_ROOTFS }}
          sudo mkdir -p ${{ env.DEBOOTSTRAP_ROOTFS }}
          # --foreign 跨架构引导，源为Ubuntu官方archive源
          sudo debootstrap \
            --arch=${{ env.ARCH }} \
            --foreign \
            ${{ env.CODENAME }} \
            ${{ env.DEBOOTSTRAP_ROOTFS }} \
            http://archive.ubuntu.com/ubuntu/

          # 注入qemu静态二进制用于chroot二阶引导
          sudo cp /usr/bin/qemu-aarch64-static ${{ env.DEBOOTSTRAP_ROOTFS }}/usr/bin/

          # 二阶完成bootstrap安装
          sudo chroot ${{ env.DEBOOTSTRAP_ROOTFS }} /bin/bash -c "/debootstrap/debootstrap --second-stage"

      ###########################################################################
      # Step2: 打包rootfs为LXD可导入镜像tar
      ###########################################################################
      - name: Package rootfs for LXD import
        run: |
          cd ${{ env.DEBOOTSTRAP_ROOTFS }}
          sudo tar -cf ../raw-rootfs.tar .
          cd ..
          # 构造LXD导入metadata
          echo '{"architecture":"aarch64","os":"ubuntu","release":"${{ env.CODENAME }}"}' > metadata.yaml
          tar -cf lxd-import.tar metadata.yaml raw-rootfs.tar

      ###########################################################################
      # Step3: LXD导入自定义rootfs镜像并启动容器（用于后续配置）
      ###########################################################################
      - name: Import custom rootfs into LXD & launch container
        run: |
          lxc image import lxd-import.tar --alias ${{ env.LXD_ALIAS }}
          lxc launch ${{ env.LXD_ALIAS }} ${{ env.LXD_CT_NAME }}
          # QEMU模拟arm64启动极慢，长等待确保systemd完全就绪
          sleep 120
          lxc info ${{ env.LXD_CT_NAME }}

      ###########################################################################
      # Step4: LXD容器内完整配置（核心需求全部在这里实现）
      ###########################################################################
      - name: Configure inside LXD container
        run: |
          lxc exec ${{ env.LXD_CT_NAME }} -- bash <<'CONFIG_EOF'
          set -euo pipefail
          CODENAME=resolute

          # 1. APT替换为华为云源
          cat > /etc/apt/sources.list <<LIST
          deb https://mirrors.huaweicloud.com/ubuntu/ ${CODENAME} main restricted universe multiverse
          deb https://mirrors.huaweicloud.com/ubuntu/ ${CODENAME}-security main restricted universe multiverse
          deb https://mirrors.huaweicloud.com/ubuntu/ ${CODENAME}-updates main restricted universe multiverse
          deb https://mirrors.huaweicloud.com/ubuntu/ ${CODENAME}-backports main restricted universe multiverse
          LIST

          apt update -qq
          apt full-upgrade -y -qq

          # 2. 完整中文本地化 + 上海时区
          locale-gen zh_CN.UTF-8
          update-locale LANG=zh_CN.UTF-8 LC_ALL=zh_CN.UTF-8 LC_MESSAGES=zh_CN.UTF-8
          echo 'LANG=zh_CN.UTF-8' > /etc/default/locale
          echo 'LC_ALL=zh_CN.UTF-8' >> /etc/default/locale
          timedatectl set-timezone Asia/Shanghai

          apt install -y -qq \
            language-pack-zh-hans language-pack-zh-hans-base \
            fonts-wqy-zenhei fonts-noto-cjk fonts-noto-cjk-extra \
            manpages-zh ttf-mscorefonts-installer

          # 3. 最全开发/运维/网络/磁盘工具包合集
          apt install -y -qq \
            build-essential gcc g++ make cmake pkg-config libssl-dev libc6-dev git git-lfs \
            openssh-server net-tools iproute2 iputils-ping dnsutils traceroute mtr iftop nload \
            tcpdump socat ncftp rsync wget curl axel aria2 nmap ipset iptables wireguard-tools \
            fdisk parted lsblk blkid e2fsprogs dosfstools ntfs-3g squashfs-tools \
            htop atop iotop bmon tree vim nano less cron logrotate lsof psmisc screen tmux \
            zip unzip rar unrar p7zip-full gzip bzip2 xz-utils zstd pigz \
            sudo ca-certificates software-properties-common apt-transport-https gnupg2 \
            jq yq bc dos2unix uuid-runtime sysstat dmidecode hdparm util-linux

          # 4. OpenSSH systemd配置、开机自启、root可密码登录（测试用）
          systemctl enable --now ssh
          sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sed -i 's/#PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          systemctl reload sshd
          echo "root:root" | chpasswd

          # 5. OpenClaw 官方一键脚本安装
          curl -fsSL https://openclaw.ai/install.sh | bash

          # 6. 清理缓存瘦身
          apt autoremove -y -qq
          apt autoclean
          apt clean
          rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* /root/.cache/*

          # 屏蔽apt CLI不稳定警告
          echo 'APT::Get::Quiet::Warning "false";' > /etc/apt/apt.conf.d/99quiet
          CONFIG_EOF

      ###########################################################################
      # Step5: 停止容器，导出纯rootfs压缩包
      ###########################################################################
      - name: Stop container & export final rootfs
        run: |
          lxc stop ${{ env.LXD_CT_NAME }}
          sleep 15
          # --rootfs-only 只导出文件系统，无LXD元数据，通用rootfs
          lxc export ${{ env.LXD_CT_NAME }} ./${{ env.FINAL_TARBALL }} --rootfs-only
          ls -lh ./${{ env.FINAL_TARBALL }}

      ###########################################################################
      # Step6: 强制清理LXD镜像与容器，避免runner残留
      ###########################################################################
      - name: Cleanup LXD resources always
        if: always()
        run: |
          lxc delete -f ${{ env.LXD_CT_NAME }} || true
          lxc image delete ${{ env.LXD_ALIAS }} || true
          sudo rm -rf ${{ env.DEBOOTSTRAP_ROOTFS }} raw-rootfs.tar lxd-import.tar metadata.yaml || true

      ###########################################################################
      # Step7: 上传产物到Action Artifact
      ###########################################################################
      - name: Upload final rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu26.04-resolute-arm64-debootstrap-lxd-rootfs
          path: ${{ env.FINAL_TARBALL }}
          retention-days: 90
