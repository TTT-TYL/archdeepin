name: Build Ubuntu 26.04 Resolute amd64 Custom RootFS (Huawei Cloud Source)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y debootstrap qemu-user-static binfmt-support tar xz-utils coreutils rsync

      - name: Build & Customize RootFS with Huawei Cloud APT source
        run: |
          export CODENAME="resolute"
          export ARCH="amd64"
          export ROOTFS_DIR="$HOME/ubuntu2604-resolute-amd64-rootfs"
          export OUTPUT_TAR="ubuntu2604-resolute-amd64-huawei-source.tar.gz"
          export HUAWEI_MIRROR="https://mirrors.huaweicloud.com/ubuntu"
          export ROOT_PWD="123456"

          rm -rf "${ROOTFS_DIR}"
          mkdir -p "${ROOTFS_DIR}"

          # 拉取rootfs
          sudo debootstrap \
            --variant=minbase \
            --arch=${ARCH} \
            ${CODENAME} \
            ${ROOTFS_DIR} \
            ${HUAWEI_MIRROR}

          # 华为云源写入
          sudo tee ${ROOTFS_DIR}/etc/apt/sources.list <<EOF
          deb ${HUAWEI_MIRROR} ${CODENAME} main restricted universe multiverse
          deb ${HUAWEI_MIRROR} ${CODENAME}-updates main restricted universe multiverse
          deb ${HUAWEI_MIRROR} ${CODENAME}-backports main restricted universe multiverse
          deb ${HUAWEI_MIRROR} ${CODENAME}-security main restricted universe multiverse
          EOF

          # 基础网络配置
          echo "ubuntu2604-amd64-huawei" | sudo tee ${ROOTFS_DIR}/etc/hostname
          sudo tee ${ROOTFS_DIR}/etc/hosts <<EOF
          127.0.0.1   localhost ubuntu2604-amd64-huawei::1         ip6-localhost ip6-loopback
          EOF
          echo "nameserver 223.5.5.5" | sudo tee ${ROOTFS_DIR}/etc/resolv.conf
          echo "nameserver 114.114.114.114" | sudo tee -a ${ROOTFS_DIR}/etc/resolv.conf

          # 挂载虚拟文件系统
          sudo mount --bind /dev ${ROOTFS_DIR}/dev
          sudo mount --bind /proc ${ROOTFS_DIR}/proc
          sudo mount --bind /sys ${ROOTFS_DIR}/sys

          # chroot内部配置
          sudo chroot ${ROOTFS_DIR} /bin/bash <<INNER_SCRIPT
          set -e
          apt update

          apt install -y --no-install-recommends \
          apt-transport-https ca-certificates gnupg2 openssl sudo \
          curl wget git vim nano tree htop ncdu iftop iotop \
          iproute2 net-tools iputils-ping dnsutils traceroute mtr \
          zip unzip tar xz-utils bzip2 lz4 zstd \
          build-essential make gcc g++ cmake pkg-config gdb \
          openssh-server cron logrotate tzdata locales systemd

          # 时区中文
          ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo "Asia/Shanghai" > /etc/timezone
          locale-gen zh_CN.UTF-8
          update-locale LANG=zh_CN.UTF-8 LC_ALL=zh_CN.UTF-8

          # root密码
          echo "root:${ROOT_PWD}" | chpasswd

          # SSH允许root密码登录
          sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sed -i 's/#PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          systemctl enable ssh

          # 清理瘦身
          apt autoremove -y
          apt autoclean
          apt clean
          rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* /root/.bash_history
          INNER_SCRIPT

          # 卸载挂载点
          sudo umount ${ROOTFS_DIR}/sys
          sudo umount ${ROOTFS_DIR}/proc
          sudo umount ${ROOTFS_DIR}/dev

          # 打包到当前工作目录（关键修复）
          cd "${ROOTFS_DIR}"
          sudo tar -zcpf "${GITHUB_WORKSPACE}/${OUTPUT_TAR}" .
          ls -lh "${GITHUB_WORKSPACE}/${OUTPUT_TAR}"

      - name: Upload RootFS Tarball to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu2604-amd64-huawei-rootfs
          path: ubuntu2604-resolute-amd64-huawei-source.tar.gz
          retention-days: 90

