name: Build Ubuntu 26.04 Resolute ARM64 RootFS
run-name: Build Ubuntu 26.04 resolute arm64 localized rootfs full tools + OpenClaw + SSH

# 触发规则
on:
  push:
    branches: [main, master]
  workflow_dispatch: # 手动触发按钮

env:
  DISTRO_CODENAME: resolute
  TARGET_ARCH: arm64
  ROOTFS_PATH: ./ubuntu-26.04-resolute-arm64-rootfs
  TARBALL_NAME: ubuntu-26.04-resolute-arm64-full-rootfs.tar.xz
  TIME_ZONE: Asia/Shanghai

jobs:
  build_rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 安装构建依赖 & QEMU ARM64 跨架构模拟
        run: |
          sudo apt update -qq
          sudo apt install -y -qq debootstrap qemu-user-static binfmt-support \
            coreutils tar xz-utils locales curl wget ca-certificates 
          # 启用arm64二进制自动解释执行
          sudo update-binfmts --enable qemu-aarch64
          # 验证qemu模拟生效
          qemu-aarch64-static --version

      - name: 第一阶段 debootstrap 拉取ARM64基础rootfs（官方构建源）
        run: |
          sudo rm -rf ${{ env.ROOTFS_PATH }}
          sudo mkdir -p ${{ env.ROOTFS_PATH }}
          # --foreign 跨架构初阶引导，源为Ubuntu官方归档源
          sudo debootstrap \
            --arch=${{ env.TARGET_ARCH }} \
            --foreign \
            ${{ env.DISTRO_CODENAME }} \
            ${{ env.ROOTFS_PATH }} \
            http://archive.ubuntu.com/ubuntu/
          # 注入静态qemu二进制，用于chroot内执行arm64程序
          sudo cp /usr/bin/qemu-aarch64-static ${{ env.ROOTFS_PATH }}/usr/bin/

      - name: 第二阶段 chroot 完成系统引导安装
        run: |
          sudo chroot ${{ env.ROOTFS_PATH }} /bin/bash -c "/debootstrap/debootstrap --second-stage"

      - name: 挂载chroot所需虚拟文件系统
        run: |
          sudo mount --bind /dev     ${{ env.ROOTFS_PATH }}/dev
          sudo mount --bind /dev/pts ${{ env.ROOTFS_PATH }}/dev/pts
          sudo mount --bind /proc    ${{ env.ROOTFS_PATH }}/proc
          sudo mount --bind /sys     ${{ env.ROOTFS_PATH }}/sys

      - name: Chroot内部完整配置（源替换、中文、工具、SSH、OpenClaw）
        run: |
          sudo chroot ${{ env.ROOTFS_PATH }} /bin/bash <<'CHROOT_EOF'
          set -euo pipefail
          CODENAME=resolute

          ######################################################################
          # 1. 替换系统APT源为华为云Ubuntu镜像源
          ######################################################################
          cat > /etc/apt/sources.list <<LIST
          deb https://mirrors.huaweicloud.com/ubuntu/ ${CODENAME} main restricted universe multiverse
          deb https://mirrors.huaweicloud.com/ubuntu/ ${CODENAME}-security main restricted universe multiverse
          deb https://mirrors.huaweicloud.com/ubuntu/ ${CODENAME}-updates main restricted universe multiverse
          deb https://mirrors.huaweicloud.com/ubuntu/ ${CODENAME}-backports main restricted universe multiverse
          LIST

          # 更新源并全量升级系统
          apt update -qq
          apt full-upgrade -y -qq

          ######################################################################
          # 2. 完整中文本地化 + 时区设置
          ######################################################################
          # 生成中文UTF-8区域语言
          locale-gen zh_CN.UTF-8
          update-locale LANG=zh_CN.UTF-8 LC_ALL=zh_CN.UTF-8 LC_MESSAGES=zh_CN.UTF-8
          echo 'LANG=zh_CN.UTF-8' > /etc/default/locale
          echo 'LC_ALL=zh_CN.UTF-8' >> /etc/default/locale

          # 设置时区上海
          timedatectl set-timezone Asia/Shanghai

          # 全套中文语言包、字体、中文手册
          apt install -y -qq \
            language-pack-zh-hans language-pack-zh-hans-base \
            fonts-wqy-zenhei fonts-noto-cjk fonts-noto-cjk-extra \
            manpages-zh ttf-mscorefonts-installer

          ######################################################################
          # 3. 最全常用工具大包（编译、网络、运维、磁盘、版本控制、调试）
          ######################################################################
          apt install -y -qq \
            # 基础编译环境
            build-essential gcc g++ make cmake pkg-config libssl-dev libc6-dev git git-lfs \
            # 网络工具全家桶
            openssh-server net-tools iproute2 iputils-ping dnsutils traceroute mtr iftop nload \
            tcpdump socat ncftp rsync wget curl axel aria2 nmap ipset iptables wireguard-tools \
            # 磁盘与文件系统工具
            fdisk parted lsblk blkid e2fsprogs dosfstools ntfs-3g mountall squashfs-tools \
            # 系统监控与运维
            htop atop iotop bmon tree vim nano less cron logrotate lsof psmisc screen tmux \
            # 压缩解压
            zip unzip rar unrar p7zip-full gzip bzip2 xz-utils zstd pigz \
            # 其他实用工具
            sudo ca-certificates software-properties-common apt-transport-https gnupg2 \
            jq yq bc dos2unix uuid-runtime sysstat dmidecode hdparm

          ######################################################################
          # 4. OpenSSH 安全配置、开机自启、root登录（测试环境）
          ######################################################################
          # 允许root密码登录，生产环境请注释这两行改用密钥登录
          sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sed -i 's/#PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
    

          ######################################################################
          # 5. 官方脚本安装 OpenClaw
          ######################################################################
          curl -fsSL https://openclaw.ai/install.sh | bash

          ######################################################################
          # 6. 清理冗余减小镜像体积
          ######################################################################
          apt autoremove -y -qq
          apt autoclean
          apt clean
          rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* /root/.cache/*
          CHROOT_EOF

      - name: 强制卸载chroot绑定挂载（防止文件系统损坏）
        if: always()
        run: |
          sudo umount -lf ${{ env.ROOTFS_PATH }}/sys     || true
          sudo umount -lf ${{ env.ROOTFS_PATH }}/proc    || true
          sudo umount -lf ${{ env.ROOTFS_PATH }}/dev/pts || true
          sudo umount -lf ${{ env.ROOTFS_PATH }}/dev     || true

      - name: 打包RootFS为高压缩tar.xz
        run: |
          cd ${{ env.ROOTFS_PATH }}
          sudo tar -cJf ../${{ env.TARBALL_NAME }} .
          ls -lh ../${{ env.TARBALL_NAME }}

      - name: 上传构建产物到Action制品
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu26.04-resolute-arm64-full-rootfs
          path: ${{ env.TARBALL_NAME }}
          retention-days: 90






