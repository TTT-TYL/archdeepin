name: Build Ubuntu26.04 amd64 RootFS | Fix Sudo/Su Auth Lock
run-name: Build resolute amd64 azure rootfs fix account lock

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Install host dependent packages
        run: |
          sudo apt update -y
          sudo apt install -y debootstrap qemu-user-static binfmt-support xz-utils

      - name: Prepare workspace dir
        run: mkdir -p ./rootfs
        working-directory: ${{ github.workspace }}

      - name: Bootstrap Ubuntu 26.04 resolute with Azure mirror
        run: |
          sudo debootstrap \
            --arch=amd64 \
            --include=ca-certificates,openssh-server,locales,tzdata,sudo,vim,curl,wget,git,iproute2,net-tools,passwd,shadow,libpam-modules,libpam-runtime \
            resolute ./rootfs \
            http://azure.archive.ubuntu.com/ubuntu
        working-directory: ${{ github.workspace }}

      - name: Replace apt sources.list full Azure mirror
        run: |
          sudo tee ./rootfs/etc/apt/sources.list <<'EOF'
          deb http://azure.archive.ubuntu.com/ubuntu/ resolute main restricted universe multiverse
          deb http://azure.archive.ubuntu.com/ubuntu/ resolute-security main restricted universe multiverse
          deb http://azure.archive.ubuntu.com/ubuntu/ resolute-updates main restricted universe multiverse
          deb http://azure.archive.ubuntu.com/ubuntu/ resolute-backports main restricted universe multiverse
          EOF
        working-directory: ${{ github.workspace }}

      - name: Bind mount virtual fs for chroot
        run: |
          sudo mount --bind /dev ./rootfs/dev
          sudo mount --bind /dev/pts ./rootfs/dev/pts
          sudo mount -t proc none ./rootfs/proc
          sudo mount -t sysfs none ./rootfs/sys
        working-directory: ${{ github.workspace }}

      - name: Chroot deploy system & fix account lock/sudo auth issue
        run: |
          sudo chroot ./rootfs /bin/bash -e <<'INNER_SCRIPT'
          apt update -y

          # 1. APT屏蔽uutils coreutils，防止后续自动替换
          cat > /etc/apt/preferences.d/block_uutils_coreutils <<APTPIN
          Package: coreutils-from-uutils
          Pin: release *
          Pin-Priority: -10
          APTPIN
          echo 'APT::Install-Recommends "false";' > /etc/apt/apt.conf.d/99-no-recommends
          echo 'APT::AutoRemove::Recommends "false";' >> /etc/apt/apt.conf.d/99-no-recommends

          # 2. 重装账号体系全套关键包，修复PAM、shadow、sudo损坏
          apt install --reinstall -y sudo passwd shadow libpam-modules libpam-runtime login --allow-remove-essential

          # =====================核心修复：解决账号锁定、su/sudo认证失败=====================
          # 重置root密码
          echo "root:123456" | chpasswd
          # 解锁root账户（关键，解决Account locked）
          passwd -u root
          # 清除账号失败锁定计数
          faillock --reset --user root || true
          # 重新生成PAM配置文件
          pam-auth-update --force
          # 修复关键文件权限（权限错乱是认证失败高频诱因）
          chmod 4755 /usr/bin/sudo
          chmod 4755 /bin/su
          chmod 600 /etc/shadow
          chmod 644 /etc/passwd
          chmod 640 /etc/group
          chown root:root /etc/shadow /etc/passwd /etc/group

          # 配置sudo允许root直接使用，放行免异常校验
          echo "root ALL=(ALL:ALL) ALL" >> /etc/sudoers
          # 加固sudoers语法安全
          visudo -c || true

          # 3. 中文本地化部署
          locale-gen zh_CN.UTF-8
          echo "LANG=zh_CN.UTF-8" > /etc/default/locale
          echo "LC_ALL=zh_CN.UTF-8" >> /etc/default/locale
          update-locale LANG=zh_CN.UTF-8 LC_ALL=zh_CN.UTF-8

          # 4. SSH配置允许root密码登录
          sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          systemctl enable ssh

          # 5. 清理缓存精简镜像体积
          apt clean
          rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
          INNER_SCRIPT
        working-directory: ${{ github.workspace }}

      - name: Unmount bind mounts safely
        run: |
          sudo umount -l ./rootfs/sys
          sudo umount -l ./rootfs/proc
          sudo umount -l ./rootfs/dev/pts
          sudo umount -l ./rootfs/dev
        working-directory: ${{ github.workspace }}

      - name: Pack rootfs to tar.xz
        run: |
          sudo tar -cJf ubuntu2604-resolute-amd64-azure-fixed.tar.xz -C ./rootfs .
        working-directory: ${{ github.workspace }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu2604-amd64-fixed-rootfs
          path: ubuntu2604-resolute-amd64-azure-fixed.tar.xz
          retention-days: 30

