name: Build Ubuntu 26.04 amd64 RootFS (GNU coreutils + Azure Mirror)
run-name: Build resolute amd64 rootfs

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install host build dependencies
        run: |
          sudo apt update -y
          sudo apt install -y debootstrap qemu-user-static binfmt-support xz-utils

      - name: Create workspace directory
        run: mkdir -p rootfs
        working-directory: ${{ github.workspace }}

      - name: Bootstrap with azure.archive.ubuntu.com
        run: |
          sudo debootstrap \
            --arch=amd64 \
            --include=ca-certificates,openssh-server,locales,tzdata,sudo,vim,curl,wget,git,iproute2,net-tools \
            resolute ./rootfs \
            http://azure.archive.ubuntu.com/ubuntu
        working-directory: ${{ github.workspace }}

      - name: Write full Azure apt sources.list
        run: |
          sudo tee ./rootfs/etc/apt/sources.list <<'EOF'
          deb http://azure.archive.ubuntu.com/ubuntu/ resolute main restricted universe multiverse
          deb http://azure.archive.ubuntu.com/ubuntu/ resolute-security main restricted universe multiverse
          deb http://azure.archive.ubuntu.com/ubuntu/ resolute-updates main restricted universe multiverse
          deb http://azure.archive.ubuntu.com/ubuntu/ resolute-backports main restricted universe multiverse
          EOF
        working-directory: ${{ github.workspace }}

      - name: Bind mount virtual filesystems
        run: |
          sudo mount --bind /dev ./rootfs/dev
          sudo mount --bind /dev/pts ./rootfs/dev/pts
          sudo mount -t proc none ./rootfs/proc
          sudo mount -t sysfs none ./rootfs/sys
        working-directory: ${{ github.workspace }}

      - name: Chroot setup GNU coreutils & environment
        run: |
          sudo chroot ./rootfs /bin/bash -e <<'SCRIPT'
          apt update

          # 第一步：预先写入拦截规则，永远拒绝安装uutils版coreutils
          cat > /etc/apt/preferences.d/block_uutils_coreutils <<APTPIN
          Package: coreutils-from-uutils
          Pin: release *
          Pin-Priority: -10
          APTPIN

          # 直接安装GNU版本虚拟包，系统自动绑定GNU coreutils
          apt install -y coreutils-from-gnu coreutils --allow-remove-essential

          # 切换系统默认alternatives指向GNU
          update-alternatives --set coreutils /usr/bin/coreutils.gnu
          ln -sf /usr/bin/coreutils.gnu /usr/bin/coreutils

          # 关闭APT推荐依赖，防止间接拉入uutils相关包
          echo 'APT::AutoRemove::Recommends "false";' > /etc/apt/apt.conf.d/99-block-uutils
          echo 'APT::Install-Recommends "false";' >> /etc/apt/apt.conf.d/99-block-uutils

          # 中文本地化
          locale-gen zh_CN.UTF-8
          echo "LANG=zh_CN.UTF-8" > /etc/default/locale
          echo "LC_ALL=zh_CN.UTF-8" >> /etc/default/locale
          update-locale LANG=zh_CN.UTF-8 LC_ALL=zh_CN.UTF-8

          # SSH配置允许root密码登录
          sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          systemctl enable ssh

          # root密码 123456
          echo "root:123456" | chpasswd

          # 清理缓存压缩体积
          apt clean
          rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
          SCRIPT
        working-directory: ${{ github.workspace }}

      - name: Safely unmount all bind mounts
        run: |
          sudo umount ./rootfs/sys
          sudo umount ./rootfs/proc
          sudo umount ./rootfs/dev/pts
          sudo umount ./rootfs/dev
        working-directory: ${{ github.workspace }}

      - name: Package rootfs to tar.xz
        run: |
          sudo tar -cJf ubuntu2604-amd64_gnu-coreutils_azure.tar.xz -C ./rootfs .
        working-directory: ${{ github.workspace }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu2604-amd64-azure-gnu-coreutils
          path: ubuntu2604-amd64_gnu-coreutils_azure.tar.xz
          retention-days: 30
